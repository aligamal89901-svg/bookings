                                  BookingsAppScreen()
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun BookingsAppScreen() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("bookings_v2_prefs", Context.MODE_PRIVATE) }
              var bookings by remember { mutableStateOf(loadBookings(context)) }
              var totalStockKilosText by remember { mutableStateOf(prefs.getString("stock_kilos", "25") ?: "25") }
              var defaultKiloPriceText by remember { mutableStateOf(prefs.getString("kilo_price", "3000") ?: "3000") }
              var defaultDeliveryFeeText by remember { mutableStateOf(prefs.getString("delivery_fee", "1000") ?: "1000") }
              var filterMode by remember { mutableStateOf("all") }
              var searchQuery by remember { mutableStateOf("") }
              var selectedPage by remember { mutableIntStateOf(0) }

              var nameInput by remember { mutableStateOf("") }
              var kiloTextInput by remember { mutableStateOf("1") }
              var orderKiloPriceInput by remember { mutableStateOf(defaultKiloPriceText) }
              var needsGrocery by remember { mutableStateOf(false) }
              var groceryTextInput by remember { mutableStateOf("") }
              var groceryCostInput by remember { mutableStateOf("") }
              var needsDelivery by remember { mutableStateOf(false) }
              var deliveryFeeInput by remember { mutableStateOf(defaultDeliveryFeeText) }

              fun persistBookings(updated: List<BookingItem>) {
                  bookings = updated
                  saveBookings(context, updated)
              }
              fun saveConfig(stock: String, price: String, delivery: String) {
                  prefs.edit().putString("stock_kilos", stock).putString("kilo_price", price)
                      .putString("delivery_fee", delivery).apply()
              }

              val totalStock = totalStockKilosText.toDoubleOrNull() ?: 0.0
              val bookedKilos = bookings.sumOf { it.kilos }
              val preparedKilos = bookings.filter { it.isReady }.sumOf { it.kilos }
              val pendingKilos = bookings.filter { !it.isReady }.sumOf { it.kilos }
              val remainingStock = (totalStock - preparedKilos).coerceAtLeast(0.0)
              val unbookedStock = (totalStock - bookedKilos).coerceAtLeast(0.0)
              val pendingCount = bookings.count { !it.isReady }
              val readyCount = bookings.count { it.isReady }
              val currentKilos = kiloTextInput.toDoubleOrNull() ?: 0.0
              val currentPrice = orderKiloPriceInput.toDoubleOrNull() ?: 0.0
              val currentGrocery = if (needsGrocery) groceryCostInput.toDoubleOrNull() ?: 0.0 else 0.0
              val currentDelivery = if (needsDelivery) deliveryFeeInput.toDoubleOrNull() ?: 0.0 else 0.0
              val liveTotal = currentKilos * currentPrice + currentGrocery + currentDelivery
              val displayedBookings = remember(bookings, filterMode, searchQuery) {
                  val q = searchQuery.trim().lowercase()
