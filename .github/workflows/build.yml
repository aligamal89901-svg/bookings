          data class BookingItem(
              val id: String = UUID.randomUUID().toString(),
              val customerName: String,
              val kilos: Double,
              val kiloPrice: Double,
              val needsGrocery: Boolean,
              val groceryText: String,
              val groceryCost: Double,
              val needsDelivery: Boolean,
              val deliveryFee: Double,
              val isReady: Boolean = false,
              val createdAt: Long = System.currentTimeMillis()
          ) {
              val dishTotal: Double get() = kilos * kiloPrice
              val grandTotal: Double get() = dishTotal + (if (needsGrocery) groceryCost else 0.0) + (if (needsDelivery) deliveryFee else 0.0)
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme(
                              colorScheme = lightColorScheme(
                                  primary = Color(0xFF163024),
