          fun formatKilo(k: Double): String {
              return if (k % 1.0 == 0.0) k.toInt().toString() else String.format(Locale.US, "%.2f", k).trimEnd('0').trimEnd('.')
          }

          fun formatMoney(m: Double): String {
              val nf = NumberFormat.getNumberInstance(Locale.US)
              nf.maximumFractionDigits = 0
              return nf.format(m)
          }

          fun saveBookings(context: Context, list: List<BookingItem>) {
              val arr = JSONArray()
              list.forEach { item ->
                  val obj = JSONObject().apply {
                      put("id", item.id)
                      put("customerName", item.customerName)
                      put("kilos", item.kilos)
                      put("kiloPrice", item.kiloPrice)
                      put("needsGrocery", item.needsGrocery)
                      put("groceryText", item.groceryText)
                      put("groceryCost", item.groceryCost)
                      put("needsDelivery", item.needsDelivery)
                      put("deliveryFee", item.deliveryFee)
                      put("isReady", item.isReady)
                      put("createdAt", item.createdAt)
                  }
                  arr.put(obj)
              }
              context.getSharedPreferences("bookings_v2_prefs", Context.MODE_PRIVATE)
                  .edit()
                  .putString("items", arr.toString())
                  .apply()
          }

          fun loadBookings(context: Context): List<BookingItem> {
              val raw = context.getSharedPreferences("bookings_v2_prefs", Context.MODE_PRIVATE)
                  .getString("items", null) ?: return emptyList()
              return try {
                  val arr = JSONArray(raw)
                  (0 until arr.length()).map { i ->
                      val o = arr.getJSONObject(i)
                      BookingItem(
                          id = o.optString("id"),
                          customerName = o.optString("customerName"),
                          kilos = o.optDouble("kilos", 1.0),
                          kiloPrice = o.optDouble("kiloPrice", 3000.0),
                          needsGrocery = o.optBoolean("needsGrocery", false),
                          groceryText = o.optString("groceryText", ""),
                          groceryCost = o.optDouble("groceryCost", 0.0),
                          needsDelivery = o.optBoolean("needsDelivery", false),
                          deliveryFee = o.optDouble("deliveryFee", 1000.0),
                          isReady = o.optBoolean("isReady", false),
                          createdAt = o.optLong("createdAt", 0L)
                      )
                  }
              } catch (e: Exception) {
                  emptyList()
              }
          }
